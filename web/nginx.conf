server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 'ok\n';
    }

    # Same-origin API for the pantry page. The path is forwarded unchanged;
    # the api process accepts /api/... as an alias. The host is a variable so
    # Docker DNS is re-resolved after the api container is recreated.
    # Read timeout stays above the 90s GapGPT client limit (recipes and fridge vision).
    # Several fridge photos are larger than recipe JSON; the api route caps them again.
    # Six photos, each up to 6 MB encoded as base64, fit under this limit.
    location /api/ {
        client_max_body_size 52m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_host api;
        proxy_pass http://$api_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 110s;
        proxy_read_timeout 110s;
    }

    # .webmanifest is missing from some nginx mime maps. An empty types block
    # makes default_type win so Chrome sees a manifest, not text/plain or HTML.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        charset utf-8;
        charset_types application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Stable service-worker URL. This exact match must not fall through to index.html.
    location = /sw.js {
        types { }
        default_type application/javascript;
        charset utf-8;
        charset_types application/javascript;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
